<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiPulseLab - Investment Test Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090a0f;
            --card-dark: #12141c;
            --accent-gold: #d4af37;
            --accent-neon: #00ffcc;
            --text-light: #f5f6fa;
            --text-gray: #8f9cae;
            --border-color: #232735;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.05) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(0, 255, 204, 0.03) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-dark);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-light);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .header h1 span {
            color: var(--accent-gold);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .header p {
            font-size: 0.9rem;
            color: var(--text-gray);
        }

        .search-box {
            position: relative;
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .search-box input {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 15px 20px;
            border-radius: 12px;
            color: var(--text-light);
            font-size: 1rem;
            font-weight: 600;
            outline: none;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--accent-gold);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
        }

        .search-box button {
            background: linear-gradient(135deg, var(--accent-gold), #b89326);
            color: #000;
            border: none;
            padding: 0 25px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .search-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        .search-box button:active {
            transform: translateY(0);
        }

        .result-panel {
            display: none;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ticker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .ticker-name {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-light);
        }

        .ticker-price {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--accent-neon);
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            border-radius: 10px;
        }

        .stat-card span {
            display: block;
        }

        .stat-card .label {
            font-size: 0.8rem;
            color: var(--text-gray);
            margin-bottom: 4px;
        }

        .stat-card .value {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-light);
        }

        .change-pill {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .change-pill.positive {
            background: rgba(46, 204, 113, 0.15);
            color: var(--success-color);
        }

        .change-pill.negative {
            background: rgba(231, 76, 60, 0.15);
            color: var(--danger-color);
        }

        .loader {
            display: none;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(212, 175, 55, 0.1);
            border-top: 3px solid var(--accent-gold);
            border-radius: 50%;
            margin: 20px auto;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            display: none;
            color: var(--danger-color);
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid rgba(231, 76, 60, 0.2);
            padding: 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>OptiPulse<span>Lab</span></h1>
            <p>Investment & Strategy Performance Monitor</p>
        </div>

        <div class="search-box">
            <input type="text" id="tickerInput" placeholder="Enter Ticker (e.g. AAPL, THYAO)" value="AAPL">
            <button id="fetchBtn">Fetch</button>
        </div>

        <div class="loader" id="loader"></div>
        <div class="error-message" id="errorMessage"></div>

        <div class="result-panel" id="resultPanel">
            <div class="ticker-header">
                <span class="ticker-name" id="tickerLabel">-</span>
                <span class="ticker-price" id="priceLabel">$-</span>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <span class="label">Open</span>
                    <span class="value" id="openLabel">-</span>
                </div>
                <div class="stat-card">
                    <span class="label">Volume</span>
                    <span class="value" id="volumeLabel">-</span>
                </div>
                <div class="stat-card">
                    <span class="label">Day High</span>
                    <span class="value" id="highLabel">-</span>
                </div>
                <div class="stat-card">
                    <span class="label">Day Low</span>
                    <span class="value" id="lowLabel">-</span>
                </div>
            </div>

            <div style="text-align: center;">
                <span class="change-pill" id="changeLabel">-</span>
            </div>
        </div>
    </div>

    <script>
        const tickerInput = document.getElementById('tickerInput');
        const fetchBtn = document.getElementById('fetchBtn');
        const loader = document.getElementById('loader');
        const errorMessage = document.getElementById('errorMessage');
        const resultPanel = document.getElementById('resultPanel');

        const tickerLabel = document.getElementById('tickerLabel');
        const priceLabel = document.getElementById('priceLabel');
        const openLabel = document.getElementById('openLabel');
        const volumeLabel = document.getElementById('volumeLabel');
        const highLabel = document.getElementById('highLabel');
        const lowLabel = document.getElementById('lowLabel');
        const changeLabel = document.getElementById('changeLabel');

        fetchBtn.addEventListener('click', fetchData);
        tickerInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') fetchData();
        });

        function fetchData() {
            const ticker = tickerInput.value.trim().toUpperCase();
            if (!ticker) return;

            // UI Reset
            errorMessage.style.display = 'none';
            resultPanel.style.display = 'none';
            loader.style.display = 'block';

            // Call root API endpoint
            fetch(`/fetch-data/${ticker}`)
                .then(res => {
                    if (!res.ok) {
                        return res.json().then(err => {
                            throw new Error(err.error || `HTTP error: ${res.status}`);
                        });
                    }
                    return res.json();
                })
                .then(data => {
                    loader.style.display = 'none';
                    
                    // Update layout labels
                    tickerLabel.textContent = data.ticker;
                    priceLabel.textContent = `${data.current_price}`;
                    openLabel.textContent = `${data.open}`;
                    volumeLabel.textContent = data.volume.toLocaleString();
                    highLabel.textContent = `${data.high}`;
                    lowLabel.textContent = `${data.low}`;
                    
                    // Format change indicator
                    const sign = data.change >= 0 ? '+' : '';
                    changeLabel.textContent = `${sign}${data.change} (${sign}${data.change_percent}%)`;
                    changeLabel.className = 'change-pill ' + (data.change >= 0 ? 'positive' : 'negative');
                    
                    resultPanel.style.display = 'block';
                })
                .catch(err => {
                    loader.style.display = 'none';
                    errorMessage.textContent = err.message || 'Connection failed to reach backend API.';
                    errorMessage.style.display = 'block';
                });
        }
    </script>
</body>
</html>
